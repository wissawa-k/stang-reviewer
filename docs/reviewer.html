<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thailand Map Drag-and-Drop Reviewer</title>
<style>
  :root {
    --bg: #f2efe7;
    --panel: #fffaf0;
    --ink: #25211b;
    --accent: #2e6f5e;
    --accent-soft: #d7e7de;
    --warn: #c1543d;
    --ok: #2f7d32;
    --line: #bdb29f;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Sarabun", "Noto Sans Thai", "Tahoma", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 10%, #fff7df 0%, rgba(255, 247, 223, 0) 42%),
      radial-gradient(circle at 90% 92%, #deeee7 0%, rgba(222, 238, 231, 0) 38%),
      var(--bg);
  }

  .app {
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(45, 40, 32, 0.08);
  }

  .map-panel {
    padding: 12px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  .map-wrap {
    position: relative;
    width: 100%;
  }

  #map {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid #d7cdba;
    background: white;
  }

  .drop-zone {
    position: absolute;
    border: 1.8px dashed rgba(46, 111, 94, 0.65);
    border-radius: 6px;
    background: rgba(215, 231, 222, 0.32);
    padding: 1px;
    transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease, border-color 120ms ease;
  }

  .drop-zone.active {
    background: rgba(215, 231, 222, 0.82);
    transform: scale(1.03);
    box-shadow: 0 0 0 2px rgba(46, 111, 94, 0.2);
  }

  .drop-zone.correct {
    border: 3px solid rgba(47, 125, 50, 0.95);
    background: rgba(47, 125, 50, 0.32);
    box-shadow: 0 0 0 3px rgba(47, 125, 50, 0.28);
    animation: pop-ok 220ms ease;
  }

  .drop-zone.incorrect {
    border: 3px solid rgba(193, 84, 61, 0.98);
    background: rgba(193, 84, 61, 0.3);
    box-shadow: 0 0 0 3px rgba(193, 84, 61, 0.24);
    animation: shake-no 260ms ease;
  }

  .drop-zone.correct::after,
  .drop-zone.incorrect::after {
    position: absolute;
    right: -1px;
    top: -20px;
    font-size: 10px;
    letter-spacing: 0.5px;
    font-weight: 800;
    color: #fff;
    border-radius: 4px;
    padding: 2px 6px;
  }

  .drop-zone.correct::after {
    content: "CORRECT";
    background: rgba(47, 125, 50, 0.98);
  }

  .drop-zone.incorrect::after {
    content: "WRONG";
    background: rgba(193, 84, 61, 0.98);
  }

  .drop-zone.correct .chip.in-slot {
    background: #eef9ef;
    border-color: rgba(47, 125, 50, 0.85);
    font-weight: 700;
  }

  .drop-zone.incorrect .chip.in-slot {
    background: #fff0ec;
    border-color: rgba(193, 84, 61, 0.85);
    font-weight: 700;
  }

  @keyframes pop-ok {
    0% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }

  @keyframes shake-no {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }

  .zone-num {
    position: absolute;
    top: -12px;
    left: -12px;
    width: 20px;
    height: 20px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--panel);
    background: var(--accent);
    pointer-events: none;
  }

  .slot {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    pointer-events: none;
  }

  .side-panel {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
  }

  .mode-badge {
    display: inline-block;
    width: fit-content;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    background: #ebe2cf;
    color: #4a3f31;
  }

  .menu-link {
    color: #5f5341;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    width: fit-content;
  }

  .menu-link:hover {
    color: #332b21;
    text-decoration: underline;
  }

  .hint {
    margin: 0;
    color: #4f4639;
    line-height: 1.45;
    font-size: 14px;
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  button {
    border: 1px solid #b5ab96;
    background: #f9f4e6;
    color: var(--ink);
    border-radius: 9px;
    padding: 8px 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #f4ecd9;
  }

  #status {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid #d3c8b3;
    background: #fffdf7;
    font-size: 14px;
    min-height: 42px;
    display: flex;
    align-items: center;
  }

  #bank {
    border: 1px dashed #b5ab96;
    border-radius: 10px;
    background: #fdf8ec;
    min-height: 140px;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
  }

  #bank-section.hidden {
    display: none;
  }

  .bank-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: #5a4e3f;
  }

  .chip {
    padding: 6px 9px;
    border-radius: 999px;
    border: 1px solid #a59b88;
    background: white;
    font-size: 14px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    white-space: nowrap;
    transition: box-shadow 120ms ease, transform 120ms ease;
  }

  .chip.selected {
    border-color: #2e6f5e;
    box-shadow: 0 0 0 3px rgba(46, 111, 94, 0.28);
    background: #f0f8f4;
  }

  .chip.in-slot {
    cursor: grab;
    width: 100%;
    height: 100%;
    border-radius: 4px;
    text-align: center;
    display: grid;
    place-items: center;
    font-size: clamp(9px, 1.35vw, 13px);
    line-height: 1.05;
    border: 1px solid #8f856f;
    background: #fffefa;
    padding: 1px 2px;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
    overflow: hidden;
  }

  .chip.dragging {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 10px 20px rgba(18, 18, 18, 0.22);
    transform: rotate(-1deg);
  }

  .zone-input {
    width: 100%;
    height: 100%;
    border: 1px solid #9a907d;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.93);
    color: #2a241d;
    font: inherit;
    font-size: clamp(11px, 1.4vw, 14px);
    padding: 1px 3px;
    text-align: center;
  }

  .zone-input:focus {
    outline: 2px solid rgba(46, 111, 94, 0.45);
    border-color: rgba(46, 111, 94, 0.9);
  }

  .drop-zone.correct .zone-input {
    background: #eefdef;
    border-color: rgba(47, 125, 50, 0.9);
    font-weight: 700;
  }

  .drop-zone.incorrect .zone-input {
    background: #fff0ec;
    border-color: rgba(193, 84, 61, 0.9);
    font-weight: 700;
  }

  @media (max-width: 980px) {
    .app {
      grid-template-columns: 1fr;
    }

    .map-wrap {
      width: max(100%, 860px);
    }

    .map-panel {
      max-height: 72vh;
    }

    .chip {
      font-size: 16px;
      padding: 9px 12px;
    }

    .zone-num {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <section class="panel map-panel">
      <div class="map-wrap" id="map-wrap">
        <img id="map" alt="Thailand rivers map">
      </div>
    </section>

    <aside class="panel side-panel">
      <h1 id="review-title">Map Reviewer</h1>
      <span id="mode-badge" class="mode-badge">Mode</span>
      <p id="review-hint" class="hint">Drag each label into the numbered box on the map. You can move any label again at any time.</p>
      <a class="menu-link" href="index.html">← Back to choices</a>

      <div class="controls">
        <button id="check-btn" type="button">Check</button>
        <button id="shuffle-btn" type="button">Shuffle</button>
        <button id="reset-btn" type="button">Reset</button>
      </div>

      <div id="status">Loading data...</div>

      <div id="bank-section">
        <p id="bank-title" class="bank-title">Labels to drag</p>
        <div id="bank" aria-label="River labels bank"></div>
      </div>
    </aside>
  </main>

<script>
const mapEl = document.getElementById("map");
const mapWrap = document.getElementById("map-wrap");
const bank = document.getElementById("bank");
const bankSection = document.getElementById("bank-section");
const bankTitle = document.getElementById("bank-title");
const statusEl = document.getElementById("status");
const titleEl = document.getElementById("review-title");
const hintEl = document.getElementById("review-hint");
const modeBadgeEl = document.getElementById("mode-badge");

const checkBtn = document.getElementById("check-btn");
const shuffleBtn = document.getElementById("shuffle-btn");
const resetBtn = document.getElementById("reset-btn");

let boxes = [];
let chips = [];
let dragging = null;
let activeZone = null;
let selectedChip = null;

const reviewModes = {
  rivers: {
    label: "River",
    json: "rivers.json",
    embeddedId: "embedded-rivers-data"
  },
  mountains: {
    label: "Mountain",
    json: "mountains.json",
    embeddedId: "embedded-mountains-data"
  }
};

const answerModes = {
  drag: {
    label: "Drag and Drop"
  },
  type: {
    label: "Type It Yourself"
  }
};

const params = new URLSearchParams(window.location.search);
const requestedMode = params.get("mode");
const requestedAnswerMode = params.get("answerMode");

if (!reviewModes[requestedMode] || !answerModes[requestedAnswerMode]) {
  window.location.replace("index.html");
}

const activeMode = reviewModes[requestedMode] ? requestedMode : "rivers";
const activeAnswerMode = answerModes[requestedAnswerMode] ? requestedAnswerMode : "drag";

function normalizeAnswer(value) {
  return value.trim().replace(/\s+/g, " ");
}

function shuffleArray(list) {
  const copy = [...list];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function clearResults() {
  mapWrap.querySelectorAll(".drop-zone").forEach((zone) => {
    zone.classList.remove("correct", "incorrect");
  });
}

function clearSelectedChip() {
  if (!selectedChip) return;
  selectedChip.classList.remove("selected");
  selectedChip = null;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function zoneById(id) {
  return mapWrap.querySelector(`.drop-zone[data-id="${id}"]`);
}

function chipById(id) {
  return chips.find((chip) => chip.dataset.id === String(id));
}

function removeChipFromZone(chip) {
  const zoneId = chip.dataset.zoneId;
  if (!zoneId) return;

  const zone = zoneById(zoneId);
  if (zone) {
    delete zone.dataset.chipId;
  }

  delete chip.dataset.zoneId;
  chip.classList.remove("in-slot");
}

function moveChipToBank(chip) {
  removeChipFromZone(chip);
  bank.appendChild(chip);
}

function placeChipInZone(chip, zone) {
  const existingId = zone.dataset.chipId;
  if (existingId && existingId !== chip.dataset.id) {
    const oldChip = chipById(existingId);
    if (oldChip) moveChipToBank(oldChip);
  }

  removeChipFromZone(chip);
  zone.dataset.chipId = chip.dataset.id;
  chip.dataset.zoneId = zone.dataset.id;
  chip.classList.add("in-slot");
  zone.querySelector(".slot").appendChild(chip);
  clearSelectedChip();
}

function updateProgressText() {
  if (activeAnswerMode === "drag") {
    const placed = chips.filter((chip) => chip.dataset.zoneId).length;
    setStatus(`Placed ${placed}/${chips.length} labels`);
    return;
  }

  const typedInputs = mapWrap.querySelectorAll(".zone-input");
  let filled = 0;
  typedInputs.forEach((input) => {
    if (normalizeAnswer(input.value) !== "") {
      filled += 1;
    }
  });
  setStatus(`Filled ${filled}/${boxes.length} answers`);
}

function focusNextInput(currentId) {
  const currentIndex = boxes.findIndex((item) => item.id === currentId);
  const next = boxes[currentIndex + 1];
  if (!next) return;
  const nextZone = zoneById(next.id);
  const nextInput = nextZone ? nextZone.querySelector(".zone-input") : null;
  if (nextInput) {
    nextInput.focus();
    nextInput.select();
  }
}

function createZone(box) {
  const zone = document.createElement("div");
  zone.className = "drop-zone";
  zone.dataset.id = String(box.id);
  zone.dataset.answer = box.answer;
  zone.style.left = `${box.x}%`;
  zone.style.top = `${box.y}%`;
  zone.style.width = `${box.width}%`;
  zone.style.height = `${box.height}%`;

  const badge = document.createElement("div");
  badge.className = "zone-num";
  badge.textContent = String(box.id);
  zone.appendChild(badge);

  if (activeAnswerMode === "drag") {
    const slot = document.createElement("div");
    slot.className = "slot";
    zone.appendChild(slot);

    zone.addEventListener("click", () => {
      if (!selectedChip) return;
      placeChipInZone(selectedChip, zone);
      clearResults();
      updateProgressText();
    });
  } else {
    const input = document.createElement("input");
    input.className = "zone-input";
    input.type = "text";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.dataset.id = String(box.id);
    input.addEventListener("input", () => {
      clearResults();
      updateProgressText();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        focusNextInput(box.id);
      }
    });
    zone.appendChild(input);
  }

  mapWrap.appendChild(zone);
}

function beginDrag(event) {
  if (activeAnswerMode !== "drag") return;
  const chip = event.currentTarget;
  event.preventDefault();
  clearSelectedChip();

  const rect = chip.getBoundingClientRect();
  dragging = {
    chip,
    offsetX: event.clientX - rect.left,
    offsetY: event.clientY - rect.top
  };

  chip.classList.add("dragging");
  chip.style.width = `${rect.width}px`;
  chip.style.height = `${rect.height}px`;
  chip.style.left = `${rect.left}px`;
  chip.style.top = `${rect.top}px`;
  document.body.appendChild(chip);
  chip.setPointerCapture(event.pointerId);
}

function moveDrag(event) {
  if (!dragging || activeAnswerMode !== "drag") return;

  const x = event.clientX - dragging.offsetX;
  const y = event.clientY - dragging.offsetY;
  dragging.chip.style.left = `${x}px`;
  dragging.chip.style.top = `${y}px`;

  const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".drop-zone");
  if (activeZone && activeZone !== target) {
    activeZone.classList.remove("active");
  }

  activeZone = target || null;
  if (activeZone) activeZone.classList.add("active");
}

function endDrag(event) {
  if (!dragging || activeAnswerMode !== "drag") return;

  const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".drop-zone");
  if (activeZone) {
    activeZone.classList.remove("active");
    activeZone = null;
  }

  dragging.chip.classList.remove("dragging");
  dragging.chip.style.removeProperty("left");
  dragging.chip.style.removeProperty("top");
  dragging.chip.style.removeProperty("width");
  dragging.chip.style.removeProperty("height");

  if (target) {
    placeChipInZone(dragging.chip, target);
  } else {
    moveChipToBank(dragging.chip);
  }

  dragging.chip.releasePointerCapture(event.pointerId);
  dragging = null;
  clearResults();
  updateProgressText();
}

function createChip(box) {
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.type = "button";
  chip.textContent = box.answer;
  chip.title = box.answer;
  chip.dataset.id = String(box.id);
  chip.dataset.answer = box.answer;
  chip.addEventListener("pointerdown", beginDrag);
  chip.addEventListener("pointermove", moveDrag);
  chip.addEventListener("pointerup", endDrag);
  chip.addEventListener("pointercancel", endDrag);
  chip.addEventListener("click", () => {
    if (activeAnswerMode !== "drag") return;
    if (dragging) return;

    if (selectedChip === chip) {
      clearSelectedChip();
      return;
    }

    clearSelectedChip();
    selectedChip = chip;
    chip.classList.add("selected");
  });
  return chip;
}

function renderChips(shuffledBoxes) {
  bank.innerHTML = "";
  chips = shuffledBoxes.map(createChip);
  chips.forEach((chip) => bank.appendChild(chip));
}

function runCheck() {
  let correct = 0;

  boxes.forEach((box) => {
    const zone = zoneById(box.id);
    if (!zone) return;
    zone.classList.remove("correct", "incorrect");

    if (activeAnswerMode === "drag") {
      const chipId = zone.dataset.chipId;
      if (!chipId) return;
      const chip = chipById(chipId);
      if (!chip) return;

      if (chip.dataset.answer === box.answer) {
        zone.classList.add("correct");
        correct += 1;
      } else {
        zone.classList.add("incorrect");
      }
      return;
    }

    const input = zone.querySelector(".zone-input");
    if (!input) return;
    const typed = normalizeAnswer(input.value);
    const expected = normalizeAnswer(box.answer);

    if (typed === "") return;
    if (typed === expected) {
      zone.classList.add("correct");
      correct += 1;
    } else {
      zone.classList.add("incorrect");
    }
  });

  if (correct === boxes.length) {
    setStatus(`Perfect! ${correct}/${boxes.length} correct`);
  } else {
    setStatus(`Score: ${correct}/${boxes.length} correct`);
  }
}

function resetBoard() {
  clearResults();
  clearSelectedChip();
  if (activeAnswerMode === "drag") {
    chips.forEach((chip) => {
      moveChipToBank(chip);
    });
  } else {
    mapWrap.querySelectorAll(".zone-input").forEach((input) => {
      input.value = "";
    });
  }
  updateProgressText();
}

function shuffleBank() {
  if (activeAnswerMode !== "drag") return;
  const inBank = chips.filter((chip) => !chip.dataset.zoneId);
  const ordered = shuffleArray(inBank);
  ordered.forEach((chip) => bank.appendChild(chip));
}

async function loadReviewData(modeConfig) {
  try {
    const response = await fetch(modeConfig.json, { cache: "no-store" });
    if (!response.ok) {
      throw new Error(`Could not load ${modeConfig.json} (${response.status})`);
    }
    return await response.json();
  } catch (fetchError) {
    const embedded = document.getElementById(modeConfig.embeddedId);
    const embeddedText = embedded ? embedded.textContent.trim() : "";
    if (!embeddedText) {
      throw fetchError;
    }

    try {
      setStatus(`Using embedded data because ${modeConfig.json} could not be fetched`);
      return JSON.parse(embeddedText);
    } catch (parseError) {
      throw new Error(`Failed to parse embedded data: ${parseError.message}`);
    }
  }
}

async function init() {
  const modeConfig = reviewModes[activeMode];
  const answerConfig = answerModes[activeAnswerMode];

  titleEl.textContent = `${modeConfig.label} Map Reviewer`;
  modeBadgeEl.textContent = answerConfig.label;

  if (activeAnswerMode === "drag") {
    hintEl.textContent = `Drag each ${modeConfig.label.toLowerCase()} label into the numbered box on the map. On mobile, you can also tap a label, then tap a box.`;
    bankTitle.textContent = `${modeConfig.label} labels to drag`;
    bankSection.classList.remove("hidden");
    shuffleBtn.disabled = false;
    shuffleBtn.title = "";
    resetBtn.textContent = "Reset";
  } else {
    hintEl.textContent = `Type each ${modeConfig.label.toLowerCase()} name directly in the numbered box. Press Enter to jump to the next box.`;
    bankSection.classList.add("hidden");
    shuffleBtn.disabled = true;
    shuffleBtn.title = "Shuffle is only available in drag mode";
    resetBtn.textContent = "Clear";
  }

  const data = await loadReviewData(modeConfig);
  mapEl.src = data.image || "rivers.png";

  await new Promise((resolve) => {
    mapEl.onload = resolve;
    if (mapEl.complete) resolve();
  });

  boxes = (data.boxes || []).filter((box) => normalizeAnswer(box.answer || "") !== "");
  boxes.forEach(createZone);

  if (activeAnswerMode === "drag") {
    renderChips(shuffleArray(boxes));
  } else {
    const firstInput = mapWrap.querySelector(".zone-input");
    if (firstInput) firstInput.focus();
  }

  updateProgressText();
}

checkBtn.addEventListener("click", runCheck);
resetBtn.addEventListener("click", resetBoard);
shuffleBtn.addEventListener("click", shuffleBank);

init().catch((error) => {
  setStatus(`Failed to load data: ${error.message}`);
});
</script>
</body>
</html>
